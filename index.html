<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070812">
  <title>Rhythm Flow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">RHYTHM TRAINER</p>
        <h1>Rhythm Flow</h1>
      </div>
      <div class="status" id="status">READY</div>
    </header>

    <section class="trainer" aria-label="Indicateur de rythme">
      <div class="scale scale-left" aria-hidden="true"><span>100%</span><span>75%</span><span>50%</span><span>25%</span><span>0%</span></div>
      <div class="track-wrap">
        <div class="track-glow"></div>
        <div class="track"></div>
        <div class="marker" id="marker" aria-label="Position du rythme">
          <span class="marker-core"></span>
          <span class="marker-glow"></span>
        </div>
      </div>
    </section>

    <section class="readout">
      <div class="readout-card"><span>POSITION</span><strong id="position">50%</strong></div>
      <div class="readout-card"><span>VITESSE</span><strong id="speed">1.00×</strong></div>
      <div class="readout-card"><span>ÉTAT</span><strong id="phase">MOVING</strong></div>
    </section>

    <section class="controls">
      <button class="primary" id="startBtn">START</button>
      <button class="secondary" id="pauseBtn" disabled>PAUSE</button>
      <button class="secondary" id="resetBtn">RESET</button>
    </section>

    <details class="settings" open>
      <summary>Réglages</summary>
      <div class="setting-grid">
        <label>Vitesse min <output id="minSpeedValue">0.60×</output><input id="minSpeed" type="range" min="0.2" max="2" step="0.05" value="0.6"></label>
        <label>Vitesse max <output id="maxSpeedValue">1.80×</output><input id="maxSpeed" type="range" min="0.5" max="3" step="0.05" value="1.8"></label>
        <label>Pause min <output id="minPauseValue">0.5 s</output><input id="minPause" type="range" min="0" max="5" step="0.1" value="0.5"></label>
        <label>Pause max <output id="maxPauseValue">2.5 s</output><input id="maxPause" type="range" min="0.2" max="8" step="0.1" value="2.5"></label>
        <label>Chance de pause <output id="pauseChanceValue">28%</output><input id="pauseChance" type="range" min="0" max="70" step="1" value="28"></label>
        <label>Variation de vitesse <output id="variationValue">25%</output><input id="variation" type="range" min="0" max="80" step="1" value="25"></label>
      </div>
    </details>

    <p class="hint">Le point monte et descend. À chaque passage, sa vitesse peut changer et il peut s'arrêter à une position imprévisible.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
